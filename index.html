<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seating Chart Designer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; }
  #library { width: 200px; border-right: 2px solid #ccc; padding: 10px; box-sizing: border-box; }
  #library h3 { margin-top: 0; margin-bottom: 5px; font-weight: normal; }
  #tabs button { display: block; width: 100%; margin-bottom: 5px; cursor: pointer; }
  #items { margin-top: 10px; }
  #items img, #items div { width: 100%; margin-bottom: 10px; cursor: grab; border: 1px solid #aaa; padding: 5px; box-sizing: border-box; text-align: center; background: #f5f5f5; }
  #main { flex: 1; padding: 10px; }
  #canvas { border: 2px solid #ccc; }
  #toolbar { margin-bottom: 10px; }
  #toolbar button { margin-right: 10px; margin-bottom: 5px; }
  #colorPickers { margin-top: 10px; }
  #colorPickers input { margin-right: 10px; }
</style>
</head>
<body>

<div id="library">
  <h3>library</h3>
  <div id="tabs">
    <button onclick="showCategory('messages')">messages</button>
    <button onclick="showCategory('custom messages')">custom messages</button>
    <button onclick="showCategory('premium cardstock')">premium cardstock</button>
    <button onclick="showCategory('designs')">designs</button>
    <button onclick="showCategory('accessories')">accessories</button>
  </div>
  <div id="items"></div>
</div>

<div id="main">
  <div id="toolbar">
    <button onclick="addCustomMessage()">add custom message</button>
    <button onclick="addPremiumCardstock()">add premium cardstock</button>
    <button onclick="addDesign()">add design</button>
    <button onclick="addAccessory()">add accessory</button>
    <button onclick="exportImage()">export as png</button>
    <div id="colorPickers">
      <label>premium cardstock color: <input type="color" id="cardstockColor" value="#FFEB3B"></label>
      <label>accessory color: <input type="color" id="accessoryColor" value="#FF5722"></label>
      <label>custom message color: <input type="color" id="customMessageColor" value="#000000"></label>
    </div>
  </div>
  <canvas id="canvas" width="1000" height="700"></canvas>
</div>

<script>
const canvas = new fabric.Canvas('canvas', { backgroundColor: '#ffffff', selection: true });

const objectsLibrary = {
  CANVAS: null,
  MESSAGES: [],
  CUSTOM_MESSAGES: [],
  PREMIUM_CARDSTOCK: [],
  DESIGNS: [],
  ACCESSORIES: []
};

// Define items for each library tab
const libraryItems = {
  messages: [
    'https://via.placeholder.com/120x60?text=Message+1',
    'https://via.placeholder.com/120x60?text=Message+2',
    'https://via.placeholder.com/120x60?text=Message+3'
  ],
  'custom messages': ['editable text'],
  'premium cardstock': ['cardstock rectangle'],
  designs: ['circle', 'triangle', 'star'],
  accessories: ['small square', 'small circle']
};

function showCategory(category) {
  const itemsDiv = document.getElementById('items');
  itemsDiv.innerHTML = ''; // clear previous items

  libraryItems[category].forEach(item => {
    if(category === 'messages') {
      const img = document.createElement('img');
      img.src = item;
      img.alt = item;
      img.onclick = () => addFixedMessageFromLibrary(img);
      itemsDiv.appendChild(img);
    } else {
      const div = document.createElement('div');
      div.innerText = item;
      div.onclick = () => {
        if(category === 'custom messages') addCustomMessage();
        else if(category === 'premium cardstock') addPremiumCardstock();
        else if(category === 'designs') addDesign();
        else if(category === 'accessories') addAccessory();
      };
      itemsDiv.appendChild(div);
    }
  });
}

// Add fixed message from library
function addFixedMessageFromLibrary(imgElement) {
  const img = new Image();
  img.src = imgElement.src;
  img.onload = function() {
    const fixedMessage = new fabric.Image(img, {
      left: 100,
      top: 100,
      selectable: true,
      hasControls: true
    });
    canvas.add(fixedMessage);
    canvas.setActiveObject(fixedMessage);
    objectsLibrary.MESSAGES.push(fixedMessage);
  };
}

// Custom messages
function addCustomMessage() {
  const color = document.getElementById('customMessageColor').value;
  const text = new fabric.IText('New Message', { left: 200, top: 150, fontSize: 20, fill: color, hasControls: true });
  canvas.add(text);
  canvas.setActiveObject(text);
  objectsLibrary.CUSTOM_MESSAGES.push(text);
}

// Premium Cardstock
function addPremiumCardstock() {
  const color = document.getElementById('cardstockColor').value;
  const rect = new fabric.Rect({ left: 300, top: 200, width: 100, height: 60, fill: color, stroke: '#000', strokeWidth: 2, hasControls: true });
  canvas.add(rect);
  canvas.setActiveObject(rect);
  objectsLibrary.PREMIUM_CARDSTOCK.push(rect);
}

// Designs
function addDesign() {
  const circle = new fabric.Circle({ radius: 30, left: 400, top: 250, fill: '#8BC34A', stroke: '#558B2F', strokeWidth: 2, hasControls: true });
  canvas.add(circle);
  canvas.setActiveObject(circle);
  objectsLibrary.DESIGNS.push(circle);
}

// Accessories
function addAccessory() {
  const color = document.getElementById('accessoryColor').value;
  const rect = new fabric.Rect({ left: 500, top: 300, width: 40, height: 40, fill: color, stroke: '#000', strokeWidth: 2, hasControls: true });
  canvas.add(rect);
  canvas.setActiveObject(rect);
  objectsLibrary.ACCESSORIES.push(rect);
}

// Live color change
canvas.on('selection:created', updateColorPickers);
canvas.on('selection:updated', updateColorPickers);

function updateColorPickers(e) {
  const obj = canvas.getActiveObject();
  if (!obj || obj === objectsLibrary.CANVAS) return;

  let colorInput = null;
  if(objectsLibrary.PREMIUM_CARDSTOCK.includes(obj)) colorInput = document.getElementById('cardstockColor');
  else if(objectsLibrary.ACCESSORIES.includes(obj)) colorInput = document.getElementById('accessoryColor');
  else if(objectsLibrary.CUSTOM_MESSAGES.includes(obj)) colorInput = document.getElementById('customMessageColor');
  else return;

  colorInput.value = obj.fill;
  colorInput.oninput = function() { obj.set('fill', this.value); canvas.renderAll(); };
}

// Export
function exportImage() {
  const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
  const link = document.createElement('a');
  link.href = dataURL;
  link.download = 'seating-chart.png';
  link.click();
}

// Keep objects above canvas
canvas.on('object:selected', e => { if(e.target !== objectsLibrary.CANVAS) e.target.bringToFront(); });

// Initialize first category
showCategory('messages');
</script>

</body>
</html>
